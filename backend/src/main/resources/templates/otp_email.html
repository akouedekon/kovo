<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code OTP</title>
    <style>
      body { font-family: Arial, sans-serif; color: #222; }
      .container { max-width: 600px; margin: 0 auto; padding: 20px; }
      .code { font-size: 28px; font-weight: bold; background:#f4f4f4; padding:12px; display:inline-block; margin-top:10px; }
      .footer { margin-top:20px; font-size:12px; color:#666 }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Bonjour,</h2>
      <p>Voici votre code de connexion pour <strong>{{appName}}</strong> :</p>
      <div class="code">{{code}}</div>
      <p class="footer">Ce code est valable 10 minutes. Si vous n'avez pas demandé ce code, ignorez cet email.</p>
    </div>
  </body>
</html>
