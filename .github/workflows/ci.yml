name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend - Maven tests & report
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # avoid relying on checkout layout; try either files/kovo/backend or backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug: list workspace
        run: |
          echo "PWD: $(pwd)" 
          ls -la || true
          ls -la . || true
          ls -la files || true

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven tests (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ -d "./files/kovo/backend" ]; then cd ./files/kovo/backend; elif [ -d "./backend" ]; then cd ./backend; else echo "Backend directory not found"; exit 1; fi
          mvn -B test --fail-at-end

      - name: Run Maven tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path -Path "./files/kovo/backend") { Set-Location -Path "./files/kovo/backend" } elseif (Test-Path -Path "./backend") { Set-Location -Path "./backend" } else { Write-Error "Backend directory not found"; exit 1 }
          mvn -B test --fail-at-end

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: |
            files/kovo/backend/target/surefire-reports/**
            backend/target/surefire-reports/**

      - name: Upload application logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs-${{ matrix.os }}
          path: |
            files/kovo/backend/target/**/*.log
            backend/target/**/*.log

  mobile-tests:
    name: Mobile - Flutter tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'

      - name: Debug: list workspace
        run: |
          echo "PWD: $(pwd)"
          ls -la || true
          ls -la files || true
          ls -la files/kovo || true

      - name: Flutter pub get
        run: |
          if [ -d "./files/kovo/mobile" ]; then cd ./files/kovo/mobile; elif [ -d "./mobile" ]; then cd ./mobile; else echo "Mobile directory not found"; exit 1; fi
          flutter pub get

      - name: Run Flutter tests (if present)
        run: |
          if [ -d "./files/kovo/mobile" ]; then cd ./files/kovo/mobile; elif [ -d "./mobile" ]; then cd ./mobile; else echo "Mobile directory not found"; exit 1; fi
          flutter test --machine > flutter_test_output.json || true

      - name: Build APK (debug)
        run: |
          if [ -d "./files/kovo/mobile" ]; then cd ./files/kovo/mobile; elif [ -d "./mobile" ]; then cd ./mobile; else echo "Mobile directory not found"; exit 1; fi
          flutter build apk --debug

      - name: Upload flutter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-artifacts
          path: |
            files/kovo/mobile/build/app/outputs/**/*.apk
            mobile/build/app/outputs/**/*.apk
            files/kovo/mobile/flutter_test_output.json
            mobile/flutter_test_output.json

  admin-build:
    name: Admin - Node build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug: list workspace
        run: |
          echo "PWD: $(pwd)"
          ls -la || true
          ls -la files || true
          ls -la files/kovo || true

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -d "./files/kovo/admin" ]; then cd ./files/kovo/admin; elif [ -d "./admin" ]; then cd ./admin; else echo "Admin directory not found"; exit 1; fi
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build admin
        run: |
          if [ -d "./files/kovo/admin" ]; then cd ./files/kovo/admin; elif [ -d "./admin" ]; then cd ./admin; else echo "Admin directory not found"; exit 1; fi
          npm run build

      - name: Upload admin build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: |
            files/kovo/admin/dist/**
            admin/dist/**

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, mobile-tests, admin-build]
    defaults:
      run:
        working-directory: ./files/kovo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        run: |
          docker build -f backend/Dockerfile -t kovo-backend:ci ./backend

      - name: Upload image as tar (artifact)
        if: always()
        run: |
          docker save kovo-backend:ci -o kovo-backend-ci.tar
      - name: Upload docker image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: kovo-backend-ci.tar

# Notes:
# - Test reports and build artifacts are uploaded as artifacts; open the workflow run in GitHub Actions to download them.
# - The Flutter job still allows missing tests (test command keeps || true), but builds will fail if build fails. Adjust as needed.
