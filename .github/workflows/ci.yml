name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend - Maven tests & report
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ./files/kovo/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven tests
        run: mvn -B test --fail-at-end

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/**

      - name: Upload application logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs-${{ matrix.os }}
          path: target/**/*.log

  mobile-tests:
    name: Mobile - Flutter tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./files/kovo/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Run Flutter tests (if present)
        run: flutter test --machine > flutter_test_output.json || true

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload flutter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-artifacts
          path: |
            build/app/outputs/**/*.apk
            flutter_test_output.json

  admin-build:
    name: Admin - Node build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./files/kovo/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run build

      - name: Upload admin build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: dist/**

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, mobile-tests, admin-build]
    defaults:
      run:
        working-directory: ./files/kovo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        run: |
          docker build -f backend/Dockerfile -t kovo-backend:ci ./backend

      - name: Upload image as tar (artifact)
        if: always()
        run: |
          docker save kovo-backend:ci -o kovo-backend-ci.tar
      - name: Upload docker image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: kovo-backend-ci.tar

# Notes:
# - Test reports and build artifacts are uploaded as artifacts; open the workflow run in GitHub Actions to download them.
# - The Flutter job still allows missing tests (test command keeps || true), but builds will fail if build fails. Adjust as needed.
